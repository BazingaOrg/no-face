<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="emoji" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#facc15"/>
    </radialGradient>
  </defs>

  <!-- squircle base -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- abstract pale mask, slightly tilted -->
  <g transform="rotate(-6 236 248)">
    <ellipse cx="236" cy="248" rx="118" ry="162" fill="url(#mask)"/>
    <!-- soft lavender brow streaks -->
    <path d="M172 196c14-10 34-12 48-6-16 2-34 8-48 6z" fill="#a78bfa" opacity="0.75"/>
    <path d="M252 190c14-10 34-12 48-6-16 2-34 8-48 6z" fill="#a78bfa" opacity="0.75"/>
    <!-- quiet eyes -->
    <ellipse cx="196" cy="226" rx="14" ry="7" fill="#1e293b"/>
    <ellipse cx="276" cy="226" rx="14" ry="7" fill="#1e293b"/>
  </g>

  <!-- emoji covering the mouth/face: the product gesture -->
  <g>
    <circle cx="330" cy="330" r="92" fill="url(#emoji)" stroke="#1e293b" stroke-width="14"/>
    <circle cx="298" cy="312" r="13" fill="#1e293b"/>
    <circle cx="362" cy="312" r="13" fill="#1e293b"/>
    <path d="M292 356c10 18 28 28 38 28s28-10 38-28" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
